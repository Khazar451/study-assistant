name: Keep demo awake

# Backup ping for the hosted demo. /api/status calls no model, so it costs nothing.
# GitHub delays scheduled workflows heavily (observed: every 2-5 hours, not every 10 minutes),
# so this alone does not keep a free Render instance awake; use an external monitor (DEPLOY.md).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping demo
        run: curl -fsS --max-time 90 --retry 2 https://study-assistant-hfmk.onrender.com/api/status
